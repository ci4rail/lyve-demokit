
services:
  benthos:
    image: ci4rail/redpanda-connect-kyt:v1.1.0
    command:
      - "-c"
      - "/config/benthos.yaml"
    restart: always
    ports:
      - 11001:11001/udp
      - 4195:4195
    volumes:
        - ./benthos-io4edge:/config:ro

  prometheus:
    image: prom/prometheus:v2.53.5
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=120d'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-admin-api'
      - '--web.enable-remote-write-receiver'
    ports:
      - 9090:9090
    restart: unless-stopped
    volumes:
      - ./prometheus:/etc/prometheus
      - demo_prom_data:/prometheus

  grafana:
    image: grafana/grafana-enterprise:11.3.1
    ports:
      - 3000:3000
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=lyve-demo
      - GF_SECURITY_ADMIN_PASSWORD=lyve123
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/dashboards
      - demo_grafana_data:/var/lib/grafana


volumes:
  demo_grafana_data:
  demo_prom_data:
